name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Test gateway
        working-directory: server
        run: ./gradlew test --no-daemon
      - name: Build gateway image
        run: docker build -f server/Dockerfile .

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the preinstalled Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Preinstalled Android SDK not found (ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset})" >&2
            exit 1
          fi
          # ubuntu-latest already exports ANDROID_SDK_ROOT. AGP aborts when
          # ANDROID_HOME points at a different tree, so both must match.
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          platform="$ANDROID_SDK_ROOT/platforms/android-36"
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          if [ -d "$platform" ] && [ -d "$build_tools" ]; then
            exit 0
          fi
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          if [ -w "$ANDROID_SDK_ROOT" ]; then
            cmd=("$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT")
          else
            cmd=(sudo "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT")
          fi
          yes | "${cmd[@]}" --licenses >/dev/null || true
          "${cmd[@]}" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK and run unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test --no-daemon
