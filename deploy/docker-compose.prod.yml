# Production stack for the Goga gateway: Caddy (TLS, Let's Encrypt) in front of
# the Ktor gateway. Only Caddy publishes ports; the gateway is reachable solely
# on the internal Docker network, so Docker's ufw bypass does not expose it.
#
# This file lives in deploy/. The image build context is the repository root
# (server/Dockerfile copies shared/ and server/). From deploy/:
#   cp .env.production.example .env && chmod 600 .env
#   docker compose -f docker-compose.prod.yml up -d --build
name: goga

services:
  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: goga-gateway:local
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-jdbc:sqlite:/data/goga.db}
    expose:
      - "8080"
    volumes:
      - ${GOGA_DATA_DIR:-./data/gateway}:/data
    networks:
      - goga
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # :80 serves the ACME HTTP-01 challenge and redirects to HTTPS.
      - "80:80"
      - "${GOGA_HTTPS_PORT:-443}:${GOGA_HTTPS_PORT:-443}"
    environment:
      GOGA_DOMAIN: ${GOGA_DOMAIN:?set GOGA_DOMAIN in .env}
      GOGA_HTTPS_PORT: ${GOGA_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data/caddy}:/data
      - ${CADDY_CONFIG_DIR:-./data/caddy-config}:/config
    networks:
      - goga
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  goga:
    driver: bridge
